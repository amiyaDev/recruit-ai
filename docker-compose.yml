services:
  db:
    image: postgres:17

    container_name: recruit-ai-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruit_ai
      PYTHONDONTWRITEBYTECODE: "1"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    volumes:
    - ./backend:/app
    - ./backend/uploads:/app/uploads

    container_name: recruit-ai-api

    ports: 
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - db

volumes:
  postgres_data: